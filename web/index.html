<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档研究 Agent</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --ink: #1a1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --thought: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .controls { display: flex; align-items: center; gap: 10px; }
  .segmented {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
  }
  .segmented button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13.5px; padding: 5px 14px;
    border-radius: 6px; cursor: pointer;
  }
  .segmented button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ghost {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: inherit; font-size: 13.5px; padding: 6px 13px;
    border-radius: 8px; cursor: pointer;
  }
  .ghost:hover { color: var(--ink); border-color: #d1d5db; }

  main { flex: 1; overflow-y: auto; padding: 26px 28px 10px; }
  .wrap { max-width: 860px; margin: 0 auto; }

  .welcome { text-align: center; color: var(--muted); padding: 64px 20px; }
  .welcome strong { color: var(--ink); display: block; font-size: 16px; margin-bottom: 6px; }
  .welcome .chips { margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .welcome .chips button {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .welcome .chips button:hover { border-color: var(--accent); color: var(--accent); }

  .qa { margin-bottom: 34px; }
  .q {
    display: inline-block; background: var(--accent-soft); color: #1e3a8a;
    padding: 9px 15px; border-radius: 12px 12px 12px 3px;
    margin-bottom: 14px; max-width: 85%; font-weight: 500;
  }
  .steps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .thought {
    background: var(--thought); color: #4b5563; font-size: 13.5px;
    padding: 9px 13px; border-radius: 9px; white-space: pre-wrap;
    border-left: 3px solid #d1d5db;
  }
  .tool {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 13px; font-size: 13.5px;
  }
  .tool .head { display: flex; gap: 8px; align-items: baseline; }
  .tool .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    flex: none; transform: translateY(-2px);
  }
  .tool .label { color: var(--ink); }
  .obs {
    color: var(--muted); font-size: 12.5px; margin-top: 6px;
    padding-left: 14px; border-left: 2px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .answer {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 15px 18px;
    white-space: pre-wrap; word-break: break-word;
  }
  .answer:empty { display: none; }
  .answer.streaming::after {
    content: ""; display: inline-block; width: 7px; height: 15px;
    background: var(--accent); margin-left: 3px; vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  details.sources { margin-top: 12px; }
  details.sources summary {
    cursor: pointer; color: var(--muted); font-size: 13px; user-select: none;
  }
  details.sources summary:hover { color: var(--accent); }
  .src {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 13px; margin-top: 8px; font-size: 13px;
  }
  .src .meta { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .src .meta b { color: #374151; font-weight: 600; }
  .src .text { color: #4b5563; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .foot { color: #9ca3af; font-size: 12px; margin-top: 9px; }
  .err {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    border-radius: 9px; padding: 10px 13px; font-size: 13.5px; margin-top: 8px;
  }

  footer {
    background: var(--card); border-top: 1px solid var(--line);
    padding: 14px 28px 16px;
  }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font: inherit; color: var(--ink); background: var(--bg);
    min-height: 46px; max-height: 140px; outline: none;
  }
  textarea:focus { border-color: var(--accent); background: var(--card); }
  #send {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 500;
    padding: 12px 22px; border-radius: 10px; cursor: pointer;
  }
  #send:disabled { background: #c7d2fe; cursor: not-allowed; }
  .hint { max-width: 860px; margin: 8px auto 0; color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>文档研究 Agent</h1>
    <p>年报语料 · ReAct 多跳检索 · <span id="stat">索引加载中…</span></p>
  </div>
  <div class="controls">
    <div class="segmented" id="modes">
      <button data-mode="agent" class="active">Agent</button>
      <button data-mode="baseline">固定管线</button>
    </div>
    <button class="ghost" id="reset">新会话</button>
  </div>
</header>

<main>
  <div class="wrap" id="chat">
    <div class="welcome" id="welcome">
      <strong>问点什么</strong>
      两份年报，467 页。Agent 会自己决定检索几次、要不要翻原页、要不要算一下。
      <div class="chips">
        <button data-q="苏宁环球2025年营业收入是多少？同比变化如何？">营业收入</button>
        <button data-q="两家公司2025年末的员工人数相差约多少倍？">员工人数对比</button>
        <button data-q="苏宁环球2025年分地区的营业收入构成是怎样的？">分地区构成</button>
        <button data-q="腾讯控股2025年的毛利率是多少？">毛利率</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Enter 发送，Shift + Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint" id="hint">Agent 模式保留多轮上下文；固定管线为单次检索对照基线。</div>
</footer>

<script>
const state = {
  sessionId: loadSessionId(),
  mode: "agent",
  busy: false,
};

function newId() {
  return "web-" + Math.random().toString(36).slice(2, 10);
}

function loadSessionId() {
  // 刷新时复用同一个会话 id：否则每次刷新都会在服务端留下一份要等 TTL 才回收
  // 的历史，多轮上下文也会丢。只有点“新会话”才主动换 id。
  let id = sessionStorage.getItem("session_id");
  if (!id) {
    id = newId();
    sessionStorage.setItem("session_id", id);
  }
  return id;
}

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("input");
const send = document.getElementById("send");
const hint = document.getElementById("hint");
const stat = document.getElementById("stat");

/* ---------- 健康检查 ---------- */
fetch("/api/health")
  .then(r => r.json())
  .then(d => {
    stat.textContent = d.status === "ok"
      ? `${d.chunks} 个片段 · top_k ${d.top_k} · ${d.llm}`
      : "索引加载中…";
  })
  .catch(() => { stat.textContent = "服务未就绪"; });

/* ---------- 模式切换 ---------- */
document.getElementById("modes").addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || state.busy) return;
  state.mode = btn.dataset.mode;
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b === btn));
  hint.textContent = state.mode === "agent"
    ? "Agent 模式保留多轮上下文；固定管线为单次检索对照基线。"
    : "固定管线只做一次 top-k 检索，无多轮记忆与精读。";
});

document.getElementById("reset").addEventListener("click", () => {
  if (state.busy) return;
  state.sessionId = newId();
  sessionStorage.setItem("session_id", state.sessionId);
  [...chat.querySelectorAll(".qa")].forEach(el => el.remove());
  welcome.style.display = "";
  input.focus();
});

/* ---------- 输入 ---------- */
function setBusy(busy) {
  state.busy = busy;
  send.disabled = busy;
  send.textContent = busy ? "生成中…" : "发送";
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
send.addEventListener("click", submit);
document.getElementById("welcome").addEventListener("click", e => {
  const chip = e.target.closest("button[data-q]");
  if (chip) { input.value = chip.dataset.q; submit(); }
});

function submit() {
  const question = input.value.trim();
  if (!question || state.busy) return;
  input.value = "";
  input.style.height = "auto";
  ask(question);
}

/* ---------- 提问 ---------- */
async function ask(question) {
  setBusy(true);
  welcome.style.display = "none";
  const block = createBlock(question);

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question,
        mode: state.mode,
        session_id: state.sessionId,
      }),
    });
    if (!res.ok) {
      const detail = await res.text();
      throw new Error(detail || `HTTP ${res.status}`);
    }
    await readSSE(res, block);
  } catch (err) {
    block.fail(err.message);
  } finally {
    block.done();
    setBusy(false);
    input.focus();
  }
}

/* ---------- SSE 解析 ---------- */
async function readSSE(response, block) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const frame = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      dispatch(frame, block);
    }
  }
}

function dispatch(frame, block) {
  let event = "message";
  let data = "";
  for (const line of frame.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return;

  let payload;
  try { payload = JSON.parse(data); } catch { return; }

  if (event === "token") block.token(payload.text);
  else if (event === "tool") block.tool(payload);
  else if (event === "observation") block.observation(payload);
  else if (event === "sources") block.sources(payload.sources);
  else if (event === "done") block.stats(payload);
  else if (event === "error") block.fail(payload.message);
}

/* ---------- 单条问答的 DOM ---------- */
function createBlock(question) {
  const root = document.createElement("section");
  root.className = "qa";
  root.innerHTML = `
    <div class="q"></div>
    <div class="steps"></div>
    <div class="answer streaming"></div>
    <div class="foot"></div>`;
  root.querySelector(".q").textContent = question;
  chat.appendChild(root);
  scrollDown();

  const stepsEl = root.querySelector(".steps");
  const answerEl = root.querySelector(".answer");
  const footEl = root.querySelector(".foot");
  let lastTool = null;

  function scrollDown() {
    window.requestAnimationFrame(() => {
      const main = document.querySelector("main");
      main.scrollTop = main.scrollHeight;
    });
  }

  return {
    token(text) {
      answerEl.textContent += text;
      scrollDown();
    },

    tool(item) {
      // 收到工具调用说明上一段文字只是推理，不是最终答案：
      // 把它降级成“思考”挪到步骤区，答案区让位给真正要输出的内容
      const pending = answerEl.textContent.trim();
      if (pending) {
        const thought = document.createElement("div");
        thought.className = "thought";
        thought.textContent = pending;
        stepsEl.appendChild(thought);
        answerEl.textContent = "";
      }
      const card = document.createElement("div");
      card.className = "tool";
      card.innerHTML = `<div class="head"><span class="dot"></span><span class="label"></span></div>`;
      card.querySelector(".label").textContent = item.label;
      stepsEl.appendChild(card);
      lastTool = card;
      scrollDown();
    },

    observation(item) {
      const obs = document.createElement("div");
      obs.className = "obs";
      obs.textContent = item.preview || "(无内容)";
      (lastTool || stepsEl).appendChild(obs);
      scrollDown();
    },

    sources(list) {
      if (!list || !list.length) return;
      const wrap = document.createElement("details");
      wrap.className = "sources";
      wrap.innerHTML = `<summary></summary>`;
      wrap.querySelector("summary").textContent = `参考资料 ${list.length} 处`;
      for (const s of list) {
        const row = document.createElement("div");
        row.className = "src";
        row.innerHTML = `<div class="meta"><b></b><span></span></div><div class="text"></div>`;
        row.querySelector("b").textContent = s.file;
        row.querySelector("span").textContent = ` p.${s.page}`;
        row.querySelector(".text").textContent = s.snippet || "";
        wrap.appendChild(row);
      }
      root.appendChild(wrap);
      scrollDown();
    },

    stats(payload) {
      const parts = [];
      if (payload.latency) parts.push(`${payload.latency}s`);
      if (payload.steps) parts.push(`${payload.steps} 步推理`);
      footEl.textContent = parts.join(" · ");
    },

    fail(message) {
      const box = document.createElement("div");
      box.className = "err";
      box.textContent = message;
      root.appendChild(box);
      scrollDown();
    },

    done() {
      answerEl.classList.remove("streaming");
    },
  };
}
</script>
</body>
</html>
